name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        # Third-party source-map warnings must not fail the build.
        run: CI=false npm run build
