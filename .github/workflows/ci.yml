name: CI/CD

# Runs for main: on every push to it, and on every pull request that targets it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        # Third-party source-map warnings must not fail the build.
        run: CI=false npm run build
        env:
          # Optional (Settings → Secrets and variables → Actions → Variables). Without them the
          # app is built in local-only mode and users can connect a database themselves.
          REACT_APP_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: End-to-end smoke test
        run: |
          npx playwright install --with-deps chromium
          PW_CHANNEL=chromium npm run e2e
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 7

  # Publishes main to Cloudflare Pages. Skipped until the repository has the variable
  # CLOUDFLARE_PROJECT and the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main
