name: CI

# Runs for main: on every push to it, and on every pull request that targets it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        # Third-party source-map warnings must not fail the build.
        run: CI=false npm run build
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 7
